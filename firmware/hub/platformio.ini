; Cortexion — Hub Firmware (ESP32 WROOM-32)
; PlatformIO configuration with pinned library versions

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Library dependencies — pinned versions for reproducible builds
lib_deps =
    powerbroker2/ELMduino@3.4.1
    sandeepmistry/LoRa@0.8.0
    mikalhart/TinyGPSPlus@1.1.0
    bodmer/TFT_eSPI@2.5.43
    electroniccats/MPU6050@1.3.0

; Include common protocol headers
lib_extra_dirs = ../common

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_RUNNING_CORE=1
    -DCONFIG_FREERTOS_HZ=1000

; Partition scheme — default 4MB with OTA
board_build.partitions = default.csv

; ── Native Test Environment (runs on host, not ESP32) ────────────
[env:native]
platform = native
test_framework = unity
lib_extra_dirs = ../common
build_flags = -std=c++17
